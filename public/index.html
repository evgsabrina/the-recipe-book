<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Recipe Book</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf8f3;--ink:#2b2a26;--muted:#7a766c;--sage:#8fa58a;--line:#e6e1d6;--tint:#f1f3ea;--r:10px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1c1b18;--ink:#f1eee6;--muted:#a09b8e;--line:#3a3831;--tint:#2a2a24}}
*{box-sizing:border-box}
html,body{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo,.num,.ph{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
h2{font-size:2rem;margin:0 0 24px}h3{margin:0 0 6px}
.header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 5vw;border-bottom:1px solid var(--line)}
.logo{color:var(--ink);text-decoration:none;font-size:1.6rem}
.menu,.icons{display:flex;gap:20px;flex-wrap:wrap}
.menu a,.icons a{color:var(--muted);text-decoration:none;font-size:.95rem;border:1px solid var(--line);border-radius:8px;padding:6px 12px;line-height:1.2}
.menu a.active,.icons a.active{color:var(--ink)}
.menu a:last-child{font-size:.85rem;border-style:dashed}
.page{max-width:1100px;margin:0 auto;padding:40px 5vw;min-width:0}
.section-gap{margin-top:64px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;margin-bottom:64px}
.hero-text h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:8px 0 16px}
.photo{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:var(--tint)}
.hero-photo{aspect-ratio:4/3;margin:24px 0 32px}
.ph{display:flex;align-items:center;justify-content:center;background:#dfe6dc;color:var(--sage);font-size:2.5rem}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.cat{width:100%;min-width:0;display:grid;gap:8px;color:var(--ink);text-decoration:none;font-size:.95rem;cursor:pointer;background:none;border:0;padding:0;text-align:left;font-family:inherit}
.cat .photo{aspect-ratio:4/3}
.cat-list{list-style:none;padding:0}
.cat-list li{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.cat-list a{color:var(--ink);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px}
.card{position:relative;display:grid;gap:4px;min-width:0}
.card-link{color:inherit;text-decoration:none;cursor:pointer}
.card h3{margin:12px 0 2px;font-size:1.3rem}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border:none;border-radius:50%;background:var(--paper);color:var(--ink);font-size:1.1rem;cursor:pointer}
.fav.on{color:#b5543c}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 36px}
.filters input,.filters select,.servings button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%;min-width:0}
.filters input{flex:1 1 220px}
.muted{color:var(--muted);font-size:.9rem}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;color:var(--sage);margin:0}
.lead{font-size:1.1rem;color:var(--muted);line-height:1.6}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:28px 0}
.meta div{padding:14px 0}
.meta dt{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
.meta dd{margin:4px 0 0;font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.actions button,.servings button{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.servings{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.servings button{padding:2px 12px}
.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:56px;align-items:start}
.ingredients ul{list-style:none;padding:0;margin:0}
.ingredients li{border-bottom:1px solid var(--line);padding:10px 0}
.ingredients label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ingredients input{margin-top:4px;accent-color:var(--sage)}
.checked span{text-decoration:line-through;color:var(--muted)}
.steps ol{list-style:none;padding:0;margin:0;display:grid;gap:48px}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}
.num{color:var(--sage);font-size:2rem;line-height:1}
.steps li.done{opacity:.5}
.steps p{line-height:1.7;margin:0 0 12px}
.steps label{cursor:pointer;font-size:.9rem}
.tip,.inspiration{border-radius:var(--r);padding:22px;margin-top:40px}
.tip{background:var(--tint)}
.tip ul{margin:0;padding-left:18px;line-height:1.6}
.inspiration{border:1px solid var(--line)}
.inspiration p{margin:4px 0}
.inspiration a{color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.fld{display:grid;gap:6px;font-size:.9rem}
.fld>span{color:var(--muted)}
.fld input,.fld select,.fld textarea,.form .row input,.form textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.form .full{grid-column:1/-1}
.form h3{margin:12px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 90px}
.add,.mini{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.mini{padding:4px 10px}
.primary{background:var(--sage)!important;color:#fff!important;border-color:var(--sage)!important}
.err{color:#b5543c;margin:0}
@media (max-width:800px){.form{grid-template-columns:1fr}}
.pic{position:relative}
.chg{display:inline-block;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.pic .chg{margin-top:10px}
.cat-item{display:grid;gap:4px;justify-items:stretch;min-width:0}
.gallery{margin-top:56px}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 84%;scroll-snap-align:start;min-width:0}
.gallery .photo,.vid,.video{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;border-radius:var(--r)}
.vid-wrap{position:relative}
.vid{background:var(--tint)}
.mute{position:absolute;right:12px;bottom:12px;font:inherit;font-size:.8rem;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.dots{display:flex;justify-content:center;gap:10px;margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.on{background:var(--ink)}
.video{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--tint)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-link{color:var(--ink)}
.video-file{display:block;width:100%;border-radius:var(--r);background:var(--tint)}
.footer{text-align:center;padding:40px 5vw;color:var(--muted);border-top:1px solid var(--line);font-size:.9rem}
@media (max-width:800px){.hero,.columns{grid-template-columns:minmax(0,1fr);gap:36px}.menu,.icons{gap:14px}}
@media (max-width:480px){
.page{padding:24px 16px}
.header{padding:12px 16px;gap:10px}
.logo{font-size:1.4rem}
.menu,.icons{gap:12px;font-size:.9rem}
.menu a,.icons a{font-size:.9rem}
h2{font-size:1.6rem}
.hero{margin-bottom:40px}
.hero-text h1{font-size:2rem}
.section-gap{margin-top:44px}
.grid{grid-template-columns:1fr 1fr;gap:16px}
.card h3{font-size:1.05rem;margin-top:8px}
.fav{width:40px;height:40px}
.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cat{font-size:.85rem}
.meta{grid-template-columns:repeat(2,1fr)}
.actions button,.servings button{padding:8px 14px;min-height:40px}
.filters{gap:8px;margin:16px 0 24px}
.filters input,.filters select,.fld input,.fld select,.fld textarea,.form .row input,.form textarea{font-size:16px}
.form{gap:14px}
.ingredients input,.steps input[type=checkbox]{width:20px;height:20px}
.ingredients li{padding:12px 0}
.steps ol{gap:32px}
.steps li{grid-template-columns:32px minmax(0,1fr);gap:12px}
.num{font-size:1.6rem}
.tip,.inspiration{padding:18px;margin-top:32px}
.footer{padding:28px 16px}
}
@media print{.header,.footer,.actions,.fav,.filters,.inspiration{display:none!important}body{background:#fff}}
</style>
</head>

let recipes = seedRecipes;

const tot = r => r.prepTime + r.cookTime;

function Photo({ src, alt, cls = '' }) {
  return src
    ? h('img', { className: 'photo ' + cls, src, alt, loading: 'lazy' })
    : h('div', { className: 'photo ph ' + cls, role: 'img', 'aria-label': alt }, h('span', null, alt.charAt(0)));
}

function Card({ r, fav, toggle, go }) {
  return h('article', { className: 'card' },
    h('a', { href: '#', className: 'card-link', onClick: e => { e.preventDefault(); go('recipe', { id: r.id }); } },
      h(Photo, { src: r.image, alt: r.name }), h('h3', null, r.name)),
    h('p', { className: 'muted' }, r.category + ' · ' + tot(r) + ' min'),
    h('button', { className: 'fav' + (fav ? ' on' : ''), onClick: () => toggle(r.id), 'aria-pressed': fav, 'aria-label': 'Salvar nos favoritos' }, fav ? '♥' : '♡'));
}

const MOSTRAR_TROCAR_FOTO = true; // true = mostra os botões "Trocar foto" na página inicial

function pickImg(e, done) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    try {
      // Fotos de capa/categoria são comprimidas antes de serem enviadas ao D1.
      // O limite por imagem evita que várias capas ultrapassem o tamanho da configuração.
      const maxSide = 700;
      const maxDataUrlLength = 120000; // aproximadamente 90 KB
      let scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      let quality = 0.48;
      let data = '';

      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      if (!ctx) throw new Error('Não foi possível preparar a imagem.');

      for (let attempt = 0; attempt < 6; attempt++) {
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', quality);

        if (data.length <= maxDataUrlLength) break;

        // Reduz gradualmente as dimensões e, se necessário, a qualidade.
        scale *= 0.82;
        quality = Math.max(0.36, quality - 0.025);
      }

      URL.revokeObjectURL(url);
      if (data.length > maxDataUrlLength) {
        alert('Esta foto ainda ficou muito grande. Escolha uma imagem menor.');
        return;
      }
      done(data);
    } catch (error) {
      URL.revokeObjectURL(url);
      alert(error.message || 'Não foi possível preparar esta imagem.');
    }
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    alert('Não foi possível abrir esta imagem. Tente outro arquivo.');
  };
  img.src = url;
}

function Home({ fav, toggle, go, covers, setCovers, admin, coversLoaded }) {
  const recent = [...recipes].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 3);
  return h('main', { className: 'page' },
    h('section', { className: 'hero' },
      h('div', { className: 'pic' },
        h(Photo, { src: covers.hero, alt: 'Fotografia principal', cls: 'hero-photo' }),
        (MOSTRAR_TROCAR_FOTO && admin && coversLoaded) && h('label', { className: 'chg' }, 'Trocar foto principal', h('input', { type: 'file', accept: 'image/*', style: { display: 'none' }, onChange: e => pickImg(e, src => setCovers(v => ({ ...v, hero: src }))) }))),
      h('div', { className: 'hero-text' },
        h('p', { className: 'eyebrow' }, 'Receitas'),
        h('h1', null, 'Uma boa refeição, feita com amor.'),
        h('p', { className: 'lead' }, 'Uma coleção de receitas para todos os momentos.'))),
    h('section', null,
      h('h2', null, 'Categorias'),
      h('div', { className: 'cat-grid' }, categories.map(c =>
        h('div', { key: c, className: 'cat-item' },
          h('button', { className: 'cat', onClick: () => go('lib', { cat: c }) }, h(Photo, { src: covers.cats && (covers.cats[c] || (c === 'Bolos e Recheios' ? covers.cats['Bolos e tortas'] : '')), alt: c }), h('span', null, c)),
          (MOSTRAR_TROCAR_FOTO && admin && coversLoaded) && h('label', { className: 'chg' }, 'Trocar foto', h('input', { type: 'file', accept: 'image/*', style: { display: 'none' }, onChange: e => pickImg(e, src => setCovers(v => ({ ...v, cats: { ...(v.cats || {}), [c]: src } }))) })))))),
    h('section', { className: 'section-gap' },
      h('h2', null, 'Receitas recentes'),
      h('div', { className: 'grid' }, recent.map(r => h(Card, { key: r.id, r, fav: fav(r.id), toggle, go })))));
}

function Categories({ go }) {
  return h('main', { className: 'page' },
    h('h1', null, 'Categorias'),
    h('ul', { className: 'cat-list' }, categories.map(c =>
      h('li', { key: c },
        h('a', { onClick: () => go('lib', { cat: c }) }, c),

          h('button', { onClick: () => setSv(s => Math.max(1, s - 1)), 'aria-label': 'Diminuir porções' }, '−'),

              h('span', null, h('strong', null, qty(q) + ' ' + u), ' ' + n)));
        })),

            : h('p', { className: 'muted' }, 'A inspiração desta receita ainda não foi informada.'))),

        h('h2', null, 'Modo de preparo'),

          return h('li', { key: i, className: done[i] ? 'done' : '' },
            h('span', { className: 'num' }, i + 1),

function embedUrl(u) {
  if (!u) return null;
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  if (yt) return 'https://www.youtube.com/embed/' + yt[1];
  const vm = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return 'https://player.vimeo.com/video/' + vm[1];
  return null;
}

function Gallery({ m }) {
  const [idx, setIdx] = useState(0);
  const [sound, setSound] = useState(false);
  const ref = useRef(null);
  if (!m) return null;
  const emb = embedUrl(m.video);
  const items = [];
  if (m.gal1) items.push(h('img', { className: 'photo', src: m.gal1, alt: 'Foto 1', draggable: false }));
  if (m.videoUrl) items.push(h('div', { className: 'vid-wrap' },
    h('video', { className: 'vid', src: m.videoUrl, autoPlay: true, loop: true, muted: !sound, playsInline: true, preload: 'auto' }),
    h('button', { className: 'mute', onClick: () => setSound(x => !x) }, sound ? 'Silenciar' : 'Ativar som')));
  else if (m.video) items.push(emb
    ? h('div', { className: 'video' }, h('iframe', { src: emb, title: 'V\u00eddeo da receita', allow: 'encrypted-media; picture-in-picture; fullscreen', allowFullScreen: true }))
    : h('a', { className: 'video-link', href: m.video, target: '_blank', rel: 'noopener noreferrer' }, 'Assistir v\u00eddeo \u2197'));
  if (m.gal2) items.push(h('img', { className: 'photo', src: m.gal2, alt: 'Foto 2', draggable: false }));
  if (!items.length) return null;
  const go = i => {
    const el = ref.current;
    if (el && el.children[i]) el.scrollTo({ left: el.children[i].offsetLeft - el.children[0].offsetLeft, behavior: 'smooth' });
  };
  const onScroll = e => {
    const el = e.currentTarget;
    const step = el.children.length > 1 ? el.children[1].offsetLeft - el.children[0].offsetLeft : el.clientWidth;
    setIdx(Math.round(el.scrollLeft / step));
  };
  return h('section', { className: 'gallery' },
    h('div', { className: 'track', ref: ref, onScroll: onScroll },
      items.map((it, i) => h('div', { key: i, className: 'slide' }, it))),
    items.length > 1 && h('div', { className: 'dots' },
      items.map((_, i) => h('button', { key: i, className: 'dot' + (i === idx ? ' on' : ''), onClick: () => go(i), 'aria-label': 'Ir para o item ' + (i + 1) }))));
}

function Form({ onSave, onCancel, initial }) {
  const blank = { name: '', description: '', category: '', image: '', prepTime: '', cookTime: '', yield: '', difficulty: 'Fácil', ingredients: [{ qty: '', unit: '', name: '' }], steps: [{ title: '', text: '' }], tips: '', siteName: '', recipeName: '', url: '', gal1: '', video: '', gal2: '', vup: '' };
  const [f, setF] = useState(() => {
    if (!initial) return blank;
    const media = initial.media || {};
    const ingredients = (initial.ingredients || []).map(i => Array.isArray(i) ? ({ qty: String(i[0] ?? ''), unit: i[1] || '', name: i[2] || '' }) : ({ qty: String(i.qty ?? ''), unit: i.unit || '', name: i.name || '' }));
    const steps = (initial.steps || []).map(step => Array.isArray(step) ? ({ title: step[0] || '', text: step[1] || '' }) : ({ title: step.title || '', text: step.text || '' }));
    return { ...blank, ...initial, ingredients: ingredients.length ? ingredients : blank.ingredients, steps: steps.length ? steps : blank.steps, tips: Array.isArray(initial.tips) ? initial.tips.join('\n') : (initial.tips || ''), siteName: initial.inspiration?.site || '', recipeName: initial.inspiration?.recipeName || '', url: initial.inspiration?.url || '', gal1: media.gal1 || '', video: media.video || '', gal2: media.gal2 || '', vup: media.videoUrl || '' };
  });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setRow = (list, i, k, v) => set(list, f[list].map((row, j) => (j === i ? { ...row, [k]: v } : row)));
  const delRow = (list, i) => set(list, f[list].filter((_, j) => j !== i));
  const addRow = (list, empty) => set(list, [...f[list], empty]);
  const pic = e => pickImg(e, src => set('image', src));
  const pickVideo = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) return setErr('O vídeo precisa ter até 20 MB.');
    try {
      const assets = window.claude ? await window.claude.use('assets') : null;
      if (!assets) return setErr('Envio de vídeo não disponível aqui. Use o link.');
      setErr('Enviando vídeo...');
      const up = await assets.upload(file);
      set('vup', up.url);
      setErr('');
    } catch (ex) {
      setErr('Não foi possível enviar o vídeo. Tente um arquivo menor ou use o link.');
    }
  };
  const num = s => {
    const t = String(s).replace(',', '.').trim();
    if (t.includes('/')) { const [a, b] = t.split('/').map(Number); return b ? a / b : 0; }
    return Number(t) || 0;
  };
  const save = () => {
    const ings = f.ingredients.filter(i => i.name.trim()).map(i => ({ qty: num(i.qty), unit: i.unit.trim(), name: i.name.trim() }));
    const steps = f.steps.filter(s => s.text.trim()).map(s => ({ title: s.title.trim() || 'Etapa', text: s.text.trim() }));
    if (!f.name.trim()) return setErr('Informe o nome da receita.');
    if (!f.category) return setErr('Escolha uma categoria.');
    if (!ings.length) return setErr('Adicione pelo menos um ingrediente.');
    if (!steps.length) return setErr('Adicione pelo menos uma etapa.');
    setErr('');
    onSave({
      id: initial?.id || ('r-' + Date.now().toString(36)), custom: true,
      name: f.name.trim(), description: f.description.trim(), category: f.category,
      image: f.image || undefined,
      prepTime: num(f.prepTime), cookTime: num(f.cookTime), yield: Math.max(1, num(f.yield) || 1),
      difficulty: f.difficulty, createdAt: initial?.createdAt || new Date().toISOString().slice(0, 10),
      ingredients: ings, steps,
      tips: f.tips.split('\n').map(t => t.trim()).filter(Boolean),
      media: { gal1: f.gal1, video: f.video.trim(), videoUrl: f.vup, gal2: f.gal2 },
      inspiration: f.siteName.trim() || f.url.trim() ? { site: f.siteName.trim(), recipeName: f.recipeName.trim(), url: f.url.trim() } : undefined,
    });
  };
  const input = (label, k, extra = {}) => h('label', { className: 'fld' },
    h('span', null, label), h('input', { value: f[k], onChange: e => set(k, e.target.value), ...extra }));
  return h('main', { className: 'page' },
    h('h1', null, initial ? 'Editar receita' : 'Nova receita'),
    h('div', { className: 'form' },
      input('Nome', 'name', { placeholder: 'Ex.: Bolo de cenoura' }),
      input('Descrição curta', 'description'),
      h('label', { className: 'fld' }, h('span', null, 'Categoria'),
        h('select', { value: f.category, onChange: e => set('category', e.target.value) },
          [h('option', { key: 'x', value: '' }, 'Escolha...'), ...categories.map(c => h('option', { key: c, value: c }, c))])),
      h('label', { className: 'fld' }, h('span', null, 'Dificuldade'),
        h('select', { value: f.difficulty, onChange: e => set('difficulty', e.target.value) },
          ['Fácil', 'Média', 'Difícil'].map(d => h('option', { key: d, value: d }, d)))),
      input('Preparo (min)', 'prepTime', { inputMode: 'numeric' }),
      input('Cozimento (min)', 'cookTime', { inputMode: 'numeric' }),
      input('Porções', 'yield', { inputMode: 'numeric' }),
      h('label', { className: 'fld full' }, h('span', null, 'Foto (opcional, até 300 KB)'),
        h('input', { type: 'file', accept: 'image/*', onChange: pic })),
      h('h3', { className: 'full' }, 'Ingredientes'),
      ...f.ingredients.map((row, i) => h('div', { key: 'i' + i, className: 'row full' },
        h('input', { placeholder: 'Qtd (ex.: 1/2)', value: row.qty, onChange: e => setRow('ingredients', i, 'qty', e.target.value), style: { maxWidth: '130px' } }),
        h('input', { placeholder: 'Unidade', value: row.unit, onChange: e => setRow('ingredients', i, 'unit', e.target.value) }),
        h('input', { placeholder: 'Ingrediente', value: row.name, onChange: e => setRow('ingredients', i, 'name', e.target.value), style: { flex: '2 1 160px' } }),
        h('button', { className: 'mini', onClick: () => delRow('ingredients', i), 'aria-label': 'Remover ingrediente' }, '×'))),
      h('div', { className: 'full' }, h('button', { className: 'add', onClick: () => addRow('ingredients', { qty: '', unit: '', name: '' }) }, '+ ingrediente')),
      h('h3', { className: 'full' }, 'Modo de preparo'),

        h('input', { placeholder: 'Título da etapa', value: row.title, onChange: e => setRow('steps', i, 'title', e.target.value), style: { flex: '1 1 200px' } }),
        h('textarea', { rows: 2, placeholder: 'Instruções', value: row.text, onChange: e => setRow('steps', i, 'text', e.target.value), style: { flex: '3 1 300px' } }),
        h('button', { className: 'mini', onClick: () => delRow('steps', i), 'aria-label': 'Remover etapa' }, '×'))),
      h('div', { className: 'full' }, h('button', { className: 'add', onClick: () => addRow('steps', { title: '', text: '' }) }, '+ etapa')),
      h('h3', { className: 'full' }, 'Inspiração (opcional)'),
      input('Site de origem', 'siteName'),
      input('Nome da receita original', 'recipeName'),
      input('Link da receita original', 'url', { type: 'url', placeholder: 'https://' }),
      h('h3', { className: 'full' }, 'Galeria (foto - vídeo - foto)'),
      h('label', { className: 'fld' }, h('span', null, 'Foto 1' + (f.gal1 ? ' ✓' : '')), h('input', { type: 'file', accept: 'image/*', onChange: e => pickImg(e, src => set('gal1', src)) })),
      input('Vídeo (link do YouTube ou Vimeo)', 'video', { placeholder: 'https://' }),
      h('label', { className: 'fld' }, h('span', null, 'Ou enviar vídeo do celular (até 20 MB)' + (f.vup ? ' ✓' : '')), h('input', { type: 'file', accept: 'video/*', onChange: pickVideo })),
      h('label', { className: 'fld' }, h('span', null, 'Foto 2' + (f.gal2 ? ' ✓' : '')), h('input', { type: 'file', accept: 'image/*', onChange: e => pickImg(e, src => set('gal2', src)) })),
      err && h('p', { className: 'err full' }, err),
      h('div', { className: 'actions full' },
        h('button', { className: 'primary', onClick: save }, initial ? 'Salvar alterações' : 'Salvar receita'),
        h('button', { onClick: onCancel }, 'Cancelar'))));
}

function App() {
  const isAdminPath = window.location.pathname === '/admin';
  const [view, setView] = useState({ name: isAdminPath ? 'admin' : 'home' });
  const [custom, setCustom] = useState([]);
  const [admin, setAdmin] = useState(false);
  const [adminPassword, setAdminPassword] = useState('');
  const [adminError, setAdminError] = useState('');
  useEffect(() => {
    fetch('/api/recipes', { credentials: 'same-origin', cache: 'no-store' })
      .then(async response => { if (!response.ok) throw new Error('Não foi possível carregar as receitas salvas.'); const data = await response.json(); if (Array.isArray(data)) setCustom(data); })
      .catch(error => console.warn(error));
    // A sessão salva no navegador não deve ativar os controles administrativos na página pública.
    if (isAdminPath) {
      fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' })
        .then(r => r.json()).then(d => setAdmin(!!d.admin)).catch(() => {});
    }
  }, []);
  const storedById = new Map(custom.map(item => [item.id, item.category === 'Bolos e tortas' ? { ...item, category: 'Bolos e Recheios' } : item]));
  const seedIds = new Set(seedRecipes.map(item => item.id));
  recipes = [
    ...seedRecipes.filter(item => !storedById.get(item.id)?.__deleted).map(item => storedById.get(item.id) || item),
    ...custom.filter(item => !seedIds.has(item.id) && !item.__deleted).map(item => item.category === 'Bolos e tortas' ? { ...item, category: 'Bolos e Recheios' } : item)
  ];
  const [covers, setCoversState] = useState({});
  const [coversLoaded, setCoversLoaded] = useState(false);
  useEffect(() => {
    Promise.all([fetch('/api/settings'), fetch('/api/session')])
      .then(async ([settingsResponse, sessionResponse]) => {
        if (!settingsResponse.ok) throw new Error('Não foi possível carregar as fotos.');
        const data = await settingsResponse.json();
        const session = sessionResponse.ok ? await sessionResponse.json() : { admin: false };
        const isAdmin = !!session.admin;
        if (isAdmin && isAdminPath) setAdmin(true);
        if (data.configured) {
          setCoversState(data.covers || {});
        } else {
          let legacy = {};
          try { legacy = JSON.parse(localStorage.getItem('capas') || '{}'); } catch (e) {}
          setCoversState(legacy);
          if (isAdmin && Object.keys(legacy).length) {
            const saved = await fetch('/api/settings', { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ covers: legacy }) });
            if (!saved.ok) console.warn('Não foi possível importar as fotos antigas.');
          }
        }
      })
      .catch(e => console.warn(e)).finally(() => setCoversLoaded(true));
  }, []);
  const setCovers = updater => {
    const next = typeof updater === 'function' ? updater(covers) : updater;
    setCoversState(next);
    fetch('/api/settings', { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ covers: next }) })
      .then(async r => {
        if (!r.ok) {
          const data = await r.json().catch(() => ({}));
          throw new Error(data.error || `Não foi possível sincronizar as fotos (erro ${r.status}).`);
        }
      })
      .catch(e => alert(e.message));
  };
  const [favs, setFavs] = useState(() => {
    try { return JSON.parse(localStorage.getItem('favoritos') || '[]'); } catch (e) { return []; }
  });
  useEffect(() => { try { localStorage.setItem('favoritos', JSON.stringify(favs)); } catch (e) {} }, [favs]);
  const toggle = id => setFavs(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const fav = id => favs.includes(id);
  const go = (name, extra = {}) => {
    if (name === 'home') setAdmin(false);
    setView({ name, ...extra });
    window.scrollTo(0, 0);
  };
  const saveRecipe = async rec => {
    try {
      const response = await fetch('/api/recipes', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) { if (response.status === 401) setAdmin(false); throw new Error(result.error || `Não foi possível salvar a receita (erro ${response.status}).`); }
      const saved = result;
      setCustom(previous => previous.some(item => item.id === saved.id) ? previous.map(item => item.id === saved.id ? saved : item) : [...previous, saved]);
      go('recipe', { id: saved.id });
    } catch (error) { alert(error.message || 'Ocorreu um erro ao salvar a receita.'); }
  };
  const removeRecipe = async recipe => {
    if (!admin || !recipe?.id || !window.confirm('Tem certeza de que deseja excluir esta receita? Esta ação não pode ser desfeita.')) return;
    try {
      const response = await fetch('/api/recipes/' + encodeURIComponent(recipe.id), { method: 'DELETE', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ isBuiltin: seedIds.has(recipe.id) }) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) { if (response.status === 401) setAdmin(false); throw new Error(result.error || `Não foi possível excluir a receita (erro ${response.status}).`); }
      if (seedIds.has(recipe.id)) setCustom(previous => [...previous.filter(item => item.id !== recipe.id), { id: recipe.id, __deleted: true }]);
      else setCustom(previous => previous.filter(item => item.id !== recipe.id));
      go('lib');
    } catch (error) { alert(error.message || 'Ocorreu um erro ao excluir a receita.'); }
  };
  const editRecipe = rec => go('editar', { id: rec.id });
  const link = (label, name) => h('a', {
    href: '#', className: view.name === name ? 'active' : '',
    onClick: e => { e.preventDefault(); go(name); }
  }, label);

  const props = { fav, toggle, go, covers, setCovers, admin, coversLoaded }; 
  const loginAdmin = async () => {
    setAdminError('');
    try {
      const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: adminPassword }) });
      const result = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(result.error === 'Admin secrets are not configured.' ? 'A senha administrativa não está configurada no Cloudflare.' : (result.error || 'Senha incorreta.'));
      const session = await fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' });
      const sessionData = await session.json().catch(() => ({}));
      if (!session.ok || !sessionData.admin) throw new Error('O login foi aceito, mas a sessão não foi reconhecida. Confira as configurações de autenticação no Cloudflare.');
      setAdmin(true); setAdminPassword(''); go('admin');
    } catch (e) { setAdminError(e.message); }
  };
  const logoutAdmin = async () => { await fetch('/api/logout', { method: 'POST' }); setAdmin(false); go('home'); };

  let body;
  if (view.name === 'admin') body = admin
    ? h('main', { className: 'page' }, h('h1', null, 'Administração'), h('p', null, 'Você está autenticada. Cadastre e gerencie suas receitas.'), h('button', { className: 'primary', onClick: () => go('nova') }, 'Cadastrar receita'), h('button', { onClick: () => go('edit-covers') }, 'Editar fotos da página inicial e categorias'), h('h2', null, 'Todas as receitas'), recipes.length ? h('div', { className: 'grid' }, recipes.map(r => h('article', { key: r.id, className: 'card' }, h('button', { className: 'card-open', onClick: () => go('recipe', { id: r.id }) }, h(Photo, { src: r.image, alt: r.name }), h('h3', null, r.name)), h('div', { className: 'actions' }, h('button', { onClick: () => go('editar', { id: r.id }) }, 'Editar'), h('button', { onClick: () => removeRecipe(r) }, 'Excluir'))))) : h('p', { className: 'muted' }, 'Nenhuma receita cadastrada ainda.'), h('button', { onClick: logoutAdmin }, 'Sair'))
    : h('main', { className: 'page' }, h('h1', null, 'Acesso administrativo'), h('p', null, 'Área restrita.'), h('input', { type: 'password', value: adminPassword, placeholder: 'Senha administrativa', onChange: e => setAdminPassword(e.target.value) }), h('button', { className: 'primary', onClick: loginAdmin }, 'Entrar'), adminError && h('p', { className: 'err' }, adminError));
  else if (view.name === 'home') body = h(Home, props);
  else if (view.name === 'edit-covers') body = admin
    ? h('div', null, h('main', { className: 'page' }, h('h1', null, 'Editar fotos do site'), h('p', null, 'Escolha as fotos da página inicial e das categorias. As alterações serão salvas no site.'), h('button', { onClick: () => go('admin') }, 'Voltar à administração')), h(Home, props))
    : h('main', { className: 'page' }, 'Acesso restrito.');
  else if (view.name === 'lib') body = h(Lib, { ...props, initCat: view.cat });
  else if (view.name === 'favs') body = h(Lib, { ...props, favOnly: true });
  else if (view.name === 'cats') body = h(Categories, { go });
  else if (view.name === 'nova') body = admin ? h(Form, { onSave: saveRecipe, onCancel: () => go('admin') }) : h('main', { className: 'page' }, 'Acesso restrito.');
  else if (view.name === 'editar') {
    const rec = recipes.find(x => x.id === view.id);
    body = admin && rec ? h(Form, { key: rec.id, initial: rec, onSave: saveRecipe, onCancel: () => go('admin') }) : h('main', { className: 'page' }, 'Receita não encontrada ou acesso restrito.');
  }
  else if (view.name === 'recipe') {
    const r = recipes.find(x => x.id === view.id);
    body = r ? h(Detail, { key: r.id, r, fav, toggle, admin, onEdit: editRecipe, onRemove: removeRecipe }) : h('main', { className: 'page' }, h('p', null, 'Receita não encontrada.'));
  }

  return h(React.Fragment, null,
    h('header', { className: 'header' },
      h('a', { href: '#', className: 'logo', onClick: e => { e.preventDefault(); go('home'); } }, 'The Recipe Book'),
      h('nav', { className: 'menu' }, link('Buscar', 'lib'), link('Categorias', 'cats'), link('Receitas', 'lib'), link('Favoritos (' + favs.length + ')', 'favs'), admin && link('Admin', 'admin')),
      h('div', { className: 'icons' })),
    body,
    h('footer', { className: 'footer' }, 'The Recipe Book · Uma coleção de receitas para todos os momentos.'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
